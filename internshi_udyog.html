    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <br>
        <h3>Select options</h3>
        <input type="radio" id="option1" name="course" value="Male">
        <label for="radio1">Male</label>
        <input type="radio" id="option2" name="course" value="Female">
        <label for="radio2">Female</label>
        <br><br>
        <h4>select course</h4>
        <select name="course" id="course">
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="PhD">PhD</option>
            <option value="MBA">MBA</option>
        </select>
        <br><br>
        <label for="technologies">Select technologies:</label>
        <textarea id="message" name="message" rows="10" cols="10"></textarea>
        <h4>Select technologies</h4>
        <input type="checkbox" id="checkbox1" name="HTML" value="HTML">
        <label for="checkbox1">HTML</label>
        <input type="checkbox" id="checkbox2" name="CSS" value="CSS">
        <label for="checkbox2">CSS</label>
        <input type="checkbox" id="checkbox3" name="JavaScript" value="JavaScript">
        <label for="checkbox3">JavaScript</label>
        <br><br>
        <input type="submit" value="Submit">
    </form>
